[project]
name = "giskard-agent"
description = "Giskard agent framework, adapted from Microsoft Agent Framework (agent-framework-core)."
authors = [{ name = "Giskard Contributors" }]
requires-python = ">=3.10"
version = "0.1.0"
license = { text = "MIT" }
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
    "msgspec>=0.20.0,<0.22",
    "typing-extensions>=4.15.0,<5",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "opentelemetry-api>=1.39.0,<2",
]

[dependency-groups]
# Optional integrations that depend on this package cannot be listed as runtime
# dependencies. They are declared here so isolated source checks can resolve their APIs.

[tool.uv]
prerelease = "if-necessary-or-explicit"
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'"
]

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = "-ra -q -r fEX"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = []
timeout = 120
markers = [
    "integration: marks tests as integration tests that require external services",
]

[tool.coverage.run]
omit = [
    "**/__init__.py"
]

[tool.ruff]

[tool.pyright]
include = ["src/giskard"]

[tool.mypy]
plugins = ['pydantic.mypy']
strict = true
incremental = false
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
show_error_codes = true
warn_unused_ignores = false
disallow_incomplete_defs = true
disallow_untyped_decorators = true

[tool.bandit]
targets = ["giskard"]
exclude_dirs = ["tests"]

[tool.poe]
executor.type = "uv"

[tool.poe.tasks.mypy]
help = "Run MyPy for this package."
cmd = "mypy --config-file $POE_ROOT/pyproject.toml src/giskard"

[tool.poe.tasks.test]
help = "Run the default unit test suite for this package."
cmd = 'pytest -m "not integration" --cov=giskard --cov-report=term-missing:skip-covered -n auto --dist worksteal tests'

[tool.flit.module]
name = "giskard"

[build-system]
requires = ["flit-core >= 3.11,<4.0"]
build-backend = "flit_core.buildapi"
